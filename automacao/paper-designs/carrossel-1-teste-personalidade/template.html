<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Mapa HDS · Carrossel — Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     MAPA HDS · CARROSSEL
     Fonte da verdade: design-system/design-system.md (raiz da Sala)
     Cores do Manual de Identidade Visual 2025. Roxo é proibido.
     Títulos em Poppins Bold, corpo em Roboto Regular, sempre à esquerda.
     Destaque = cor (laranja no título grande, âmbar no fundo escuro). Sem itálico.
     ========================================================= */
  :root {
    --paper: #FFFFFF;        /* fundo padrão */
    --soft: #E4EEF0;         /* Alice Blue — cartões e fundo alternativo */
    --ink: #1A1A1A;          /* Eerie Black — texto */
    --ink-soft: #162F42;     /* Prussian Blue */
    --brand: #FF560B;        /* Orange (Pantone) — cor da marca */
    --deep: #065156;         /* Midnight Green — slide de princípio */
    --accent: #FF560B;       /* laranja: só em título grande sobre branco */
    --accent-dark: #EC691B;  /* Spanish Orange */
    --accent-text: #D94021;  /* Chilli Red — destaque em texto menor sobre branco */
    --accent-on-dark: #FF971A; /* Princeton Orange — destaque em fundo escuro */
    --line: rgba(26, 26, 26, 0.12);
    --line-strong: rgba(26, 26, 26, 0.25);
    --muted: rgba(26, 26, 26, 0.60);

    --paper-cream: var(--paper);
    --paper-cream-deep: var(--soft);
    --ink-dim: var(--ink-soft);
    --ink-muted: var(--muted);
    --hairline: var(--line);
    --accent-deep: var(--accent-text);
    --accent-ink: var(--ink);

    --f-display: 'Poppins', system-ui, sans-serif;
    --f-body: 'Roboto', system-ui, sans-serif;
    --f-mono: 'Poppins', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #DADADA; }
  body { font-family: var(--f-body); }

  .slide {
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    color: var(--ink);
    padding: 88px 80px;
    display: flex;
    flex-direction: column;
    position: relative;
    page-break-after: always;
    overflow: hidden;
  }

  /* ===== HEADER LOCKUP ===== */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
    position: relative;
    z-index: 2;
  }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .lockup .logo { height: 46px; width: auto; display: block; }
  .lockup .logo-dark { display: none; }
  .slide.principle .lockup .logo-light { display: none; }
  .slide.principle .lockup .logo-dark { display: block; }
  
  .mark {
    width: 32px; height: 32px;
    background: var(--ink);
    clip-path: polygon(0 0, 100% 0, 100% 60%, 60% 60%, 60% 100%, 0 100%);
  }
  .name {
    font-family: var(--f-body);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.018em;
    color: var(--ink);
  }
  .handle {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* ===== EYEBROW ===== */
  .eyebrow {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent-text);
    margin-bottom: 28px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .eyebrow::before {
    content: '';
    width: 24px;
    height: 2px;
    background: var(--accent-text);
    display: inline-block;
  }

  /* ===== TITLE ===== */
  .title {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 108px;
    line-height: 1.0;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-wrap: balance;
  }
  .title strong, .title b { font-weight: 800; font-style: normal; color: var(--ink); }
  .title em {
    font-style: normal;
    font-weight: 800;
    color: var(--accent-text);
  }

  /* ===== BODY ===== */
  .body-text {
    font-family: var(--f-body);
    font-size: 32px;
    line-height: 1.5;
    color: var(--ink-soft);
    font-weight: 400;
    text-wrap: pretty;
    margin-top: 36px;
    max-width: 920px;
    letter-spacing: -0.005em;
  }
  .body-text br + br { display: block; content: ''; margin-top: 18px; }
  .body-text strong, .body-text b {
    color: var(--ink);
    font-weight: 600;
  }
  .body-text em {
    font-style: normal;
    color: var(--accent-text);
    font-weight: 500;
  }

  /* ===== SOURCE LINE / IMAGE CAPTION ===== */
  .source, .img-caption {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .source {
    margin-top: 32px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
    width: fit-content;
  }

  /* ===== CONTENT WRAPPER ===== */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .content.top-aligned {
    justify-content: flex-start;
    padding-top: 8px;
  }

  /* ===== FOOT ===== */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    position: relative;
    z-index: 2;
  }
  .foot .arrow { color: var(--ink); font-weight: 600; }
  .foot .arrow .arr { margin-left: 8px; font-size: 18px; }

  /* =========================================================
     KIND VARIANTS
     ========================================================= */

  /* --- COVER --- */
  .slide.cover .content { justify-content: center; gap: 36px; }
  .slide.cover .cover-block {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 88px;
    line-height: 1.0;
    letter-spacing: -0.03em;
    color: var(--ink);
    text-transform: none;
    text-wrap: balance;
  }
  .slide.cover .cover-block p { margin-bottom: 14px; }
  .slide.cover .cover-block p:last-child { margin-bottom: 0; }
  .slide.cover .cover-block strong { font-weight: 800; }
  .slide.cover .cover-block em {
    font-style: normal;
    color: var(--accent);
    font-weight: 800;
    text-transform: none;
  }
  .slide.cover .cover-hook {
    font-family: var(--f-display);
    font-style: normal;
    font-weight: 700;
    font-size: 38px;
    line-height: 1.18;
    color: var(--accent-text);
    text-transform: none;
    letter-spacing: -0.02em;
    margin-top: 20px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    max-width: 880px;
  }
  .slide.cover .cover-hook .arr { color: var(--accent-text); font-weight: 500; }

  /* --- COVER COM IMAGEM --- */
  .slide.cover.with-image { padding: 0; }
  .slide.cover.with-image .header-strip { padding: 88px 80px 0; }
  .slide.cover.with-image .image-zone {
    width: calc(100% - 160px);
    margin: 28px 80px 0;
    height: 380px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 2px;
    box-shadow: 0 1px 0 var(--line);
  }
  .slide.cover.with-image .text-strip {
    padding: 32px 80px 72px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .slide.cover.with-image .cover-block {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 72px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    text-transform: none;
  }
  .slide.cover.with-image .cover-block strong { font-weight: 800; }
  .slide.cover.with-image .cover-block em {
    font-weight: 800;
    color: var(--accent-text);
    text-transform: none;
    font-style: normal;
  }
  .slide.cover.with-image .cover-hook {
    font-size: 28px;
    margin-top: 22px;
  }
  .slide.cover.with-image .text-strip .foot { margin-top: 22px; }

  /* --- PRINCIPLE (slide invertido, fundo Ink) --- */
  .slide.principle {
    background: var(--deep);
    color: #FFFFFF;
  }
  .slide.principle .name { color: var(--paper); }
  .slide.principle .mark { background: var(--accent-on-dark); }
  .slide.principle .handle { color: rgba(255, 255, 255, 0.55); }
  .slide.principle .eyebrow { color: var(--accent-on-dark); }
  .slide.principle .eyebrow::before { background: var(--accent-on-dark); }
  .slide.principle .title {
    font-size: 100px;
    color: var(--paper);
  }
  .slide.principle .title strong { color: var(--accent-on-dark); font-weight: 800; }
  .slide.principle .title em { color: var(--accent-on-dark); }
  .slide.principle .body-text {
    color: rgba(255, 255, 255, 0.72);
    font-size: 28px;
    margin-top: 36px;
  }
  .slide.principle .body-text strong { color: var(--paper); }
  .slide.principle .foot {
    border-top-color: rgba(0, 240, 0, 0.3);
    color: rgba(255, 255, 255, 0.6);
  }
  .slide.principle .foot .arrow { color: var(--paper); }
  .slide.principle .content { justify-content: center; }

  /* --- NARRATIVE com imagem --- */
  .slide.narrative.with-image { padding: 0; }
  .slide.narrative.with-image .header-strip { padding: 88px 80px 0; }
  .slide.narrative.with-image .image-zone {
    width: calc(100% - 160px);
    margin: 40px 80px 0;
    height: 520px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 2px;
    box-shadow: 0 1px 0 var(--line);
    position: relative;
  }
  .slide.narrative.with-image .image-zone::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0; bottom: 0;
    border: 1px solid rgba(26,26,26,0.06);
    border-radius: 2px;
  }
  .slide.narrative.with-image .text-strip {
    padding: 36px 80px 80px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .slide.narrative.with-image .text-strip .eyebrow { margin-bottom: 16px; margin-top: 0; }
  .slide.narrative.with-image .text-strip .title { font-size: 60px; line-height: 1.04; }
  .slide.narrative.with-image .text-strip .body-text { font-size: 28px; margin-top: 22px; }
  .slide.narrative.with-image .text-strip .foot { margin-top: 28px; }

  /* --- SCENE --- */
  .slide.scene .content { justify-content: center; padding-top: 0; }
  .slide.scene .title { font-size: 96px; line-height: 1.0; }
  .slide.scene .body-text { font-size: 36px; line-height: 1.45; margin-top: 40px; }

  /* --- NARRATIVE (text-only) --- */
  .slide.narrative .content { justify-content: center; padding-top: 0; }
  .slide.narrative .title { font-size: 84px; line-height: 1.02; }
  .slide.narrative .body-text { font-size: 32px; line-height: 1.45; margin-top: 36px; }

  /* --- MECHLIST --- */
  .slide.mechlist .content { justify-content: center; padding-top: 0; }
  .slide.mechlist .title { font-size: 76px; line-height: 1.04; }
  .slide.mechlist .pair-list {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 920px;
  }
  .slide.mechlist .pair {
    display: flex;
    align-items: baseline;
    gap: 22px;
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 38px;
    line-height: 1.22;
    color: var(--ink-soft);
    letter-spacing: -0.02em;
  }
  .slide.mechlist .pair-from { flex: 1; color: var(--ink-soft); }
  .slide.mechlist .pair-arrow {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 26px;
    color: var(--accent-text);
  }
  .slide.mechlist .pair-to {
    font-weight: 600;
    color: var(--ink);
    background: var(--accent);
    padding: 2px 16px;
    border-radius: 3px;
    letter-spacing: -0.02em;
  }
  .slide.mechlist .closing {
    margin-top: 48px;
    font-family: var(--f-body);
    font-size: 28px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 900px;
  }
  .slide.mechlist .closing strong { color: var(--ink); font-weight: 600; }

  /* --- VIA-CARDS --- */
  .slide.via-cards.with-image { padding: 0; }
  .slide.via-cards.with-image .header-strip { padding: 88px 80px 0; }
  .slide.via-cards.with-image .image-zone {
    width: calc(100% - 160px);
    margin: 40px 80px 0;
    height: 380px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 2px;
  }
  .slide.via-cards.with-image .text-strip {
    padding: 36px 80px 80px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .slide.via-cards .eyebrow { margin-bottom: 14px; margin-top: 0; }
  .slide.via-cards .title { font-size: 62px; line-height: 1.04; margin-bottom: 22px; }
  .slide.via-cards .vias {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 8px;
  }
  .slide.via-cards .via {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 20px;
    border-left: 3px solid var(--accent);
    padding: 10px 0 10px 20px;
  }
  .slide.via-cards .via-n {
    font-family: var(--f-body);
    font-size: 36px;
    font-weight: 700;
    color: var(--accent-text);
    line-height: 1;
    align-self: start;
    padding-top: 4px;
    letter-spacing: -0.02em;
  }
  .slide.via-cards .via-content { display: flex; flex-direction: column; gap: 6px; }
  .slide.via-cards .via-label {
    font-family: var(--f-body);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .slide.via-cards .via-text {
    font-family: var(--f-body);
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink-soft);
  }
  .slide.via-cards .closing {
    margin-top: 22px;
    font-family: var(--f-body);
    font-size: 24px;
    line-height: 1.45;
    color: var(--ink-soft);
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .slide.via-cards .closing strong { color: var(--ink); font-weight: 600; }
  .slide.via-cards .text-strip .foot { margin-top: 22px; }

  /* --- SCENELIST --- */
  .slide.scenelist .content { justify-content: center; padding-top: 0; }
  .slide.scenelist .title { font-size: 66px; line-height: 1.04; }
  .slide.scenelist .scene-list {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 920px;
  }
  .slide.scenelist .scene-item {
    font-family: var(--f-body);
    font-size: 28px;
    line-height: 1.5;
    color: var(--ink-soft);
    padding-left: 30px;
    position: relative;
  }
  .slide.scenelist .scene-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 17px;
    width: 16px;
    height: 2px;
    background: var(--accent-text);
  }
  .slide.scenelist .scene-item strong { color: var(--ink); font-weight: 600; }
  .slide.scenelist .scene-item em { color: var(--accent-text); font-style: normal; font-weight: 500; }
  .slide.scenelist .closing {
    margin-top: 44px;
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 34px;
    color: var(--accent-text);
    line-height: 1.3;
    letter-spacing: -0.02em;
  }

  /* --- REBUTTAL --- */
  .slide.rebuttal .content { justify-content: center; padding-top: 0; }
  .slide.rebuttal .title { font-size: 70px; line-height: 1.04; }
  .slide.rebuttal .strike-block {
    margin-top: 40px;
    display: flex;
    align-items: flex-start;
    gap: 24px;
    padding: 24px 28px;
    background: var(--soft);
    border-radius: 2px;
    max-width: 920px;
  }
  .slide.rebuttal .strike-x {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 48px;
    line-height: 0.8;
    color: var(--accent-text);
    padding-top: 4px;
  }
  .slide.rebuttal .strike-content { flex: 1; }
  .slide.rebuttal .strike-text {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 30px;
    line-height: 1.3;
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--accent-text);
    text-decoration-thickness: 2px;
    letter-spacing: -0.02em;
  }
  .slide.rebuttal .strike-note {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 16px;
    color: var(--accent-text);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-top: 12px;
  }
  .slide.rebuttal .body-text {
    font-size: 28px;
    line-height: 1.5;
    margin-top: 36px;
    max-width: 920px;
  }

  /* --- SLAM --- */
  .slide.slam.with-image { padding: 0; }
  .slide.slam.with-image .header-strip { padding: 88px 80px 0; }
  .slide.slam.with-image .image-zone {
    width: calc(100% - 160px);
    margin: 40px 80px 0;
    height: 460px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 2px;
  }
  .slide.slam.with-image .text-strip {
    padding: 36px 80px 80px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .slide.slam .eyebrow { margin-bottom: 14px; margin-top: 0; }
  .slide.slam .title { font-size: 52px; line-height: 1.06; margin-bottom: 16px; }
  .slide.slam .body-text {
    font-size: 24px;
    margin-top: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .slide.slam .final-block {
    margin-top: 24px;
    padding: 22px 0 8px;
    border-top: 2px solid var(--accent);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .slide.slam .final-line {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 32px;
    line-height: 1.22;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .slide.slam .final-line strong { color: var(--accent-text); font-weight: 700; }
  .slide.slam .text-strip .foot { margin-top: 24px; }

  /* --- OFFER --- */
  .slide.offer .content { justify-content: flex-start; padding-top: 8px; }
  .slide.offer .title { font-size: 84px; line-height: 1.04; }
  .slide.offer .body-text { font-size: 28px; margin-top: 28px; }
  .slide.offer .pasta-list {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 920px;
  }
  .slide.offer .pasta-line {
    font-family: var(--f-body);
    font-size: 28px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  .slide.offer .pasta-line .pasta-key {
    font-family: var(--f-body);
    font-weight: 600;
    color: var(--ink);
    background: var(--accent);
    padding: 2px 14px;
    margin-right: 10px;
    border-radius: 3px;
    letter-spacing: -0.01em;
  }
  .slide.offer .pasta-closing {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 34px;
    line-height: 1.3;
    color: var(--ink);
    margin-top: 36px;
    max-width: 920px;
    letter-spacing: -0.02em;
  }

  /* --- CTA (minimalista) --- */
  .slide.cta .content {
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
  }
  .slide.cta .eyebrow {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 36px;
    color: var(--ink-soft);
    text-transform: none;
    letter-spacing: -0.02em;
    margin-bottom: 0;
  }
  .slide.cta .eyebrow::before { display: none; }
  .slide.cta .title {
    font-size: 168px;
    line-height: 0.95;
    color: var(--accent-text);
    letter-spacing: -0.04em;
  }
  .slide.cta .title strong { color: var(--accent-text); font-weight: 700; }

  /* --- CTA-VERBOSE --- */
  .slide.cta-verbose .content { justify-content: center; padding-top: 0; gap: 8px; }
  .slide.cta-verbose .eyebrow { margin-bottom: 12px; }
  .slide.cta-verbose .title { font-size: 92px; line-height: 1.02; letter-spacing: -0.035em; }
  .slide.cta-verbose .title strong {
    color: var(--accent-text);
    font-weight: 700;
  }
  .slide.cta-verbose .cta-call {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 44px;
    color: var(--accent-text);
